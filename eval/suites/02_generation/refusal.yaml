# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Generation (isolated) › Refusal — questions the docs cannot answer get an honest 'I don't know', not a made-up answer"

prompts:
  - id: bree-v2
    label: "prompt-v2"
    raw: |
      You are Bree, the customer support assistant for Brindlework, a project management platform.

      Answer the user's question using ONLY the context below.
      - If the context does not contain the answer, say you don't know and suggest contacting support@brindlework.example.
      - If the question is ambiguous and the conversation does not make clear what it refers to (for example "it",
        "the limit", or "how much" without a plan or feature), ask one short clarifying question instead of guessing.
        You may briefly list the likely options.
      - Cite the chunk IDs you used in square brackets, for example [pricing_plans#chunk_1].
      - If sources conflict, prefer official documents over community content, and newer documents over older or archived ones.
      - Be concise and specific.

      Context:
      <<RETRIEVED_CONTEXT>>

      Question: {{query}}
      Answer:

providers:
  - id: file://../../providers/generation_only.py
    label: generation-recommended
    config:
      pipeline: recommended
      workers: 4

defaultTest:
  options:
    provider:
      id: openai:gpt-6-luna
      config:
        omitDefaults: true
        passthrough: { reasoning: { effort: medium } }
  assert:
    - type: llm-rubric
      value: |
        The user asked a question that the Brindlework documentation does not answer.
        Expected behavior: {{reference_answer}}

        Pass if the response clearly says it does not know or that the information is not available, and does not
        present invented specifics (prices, names, integrations, compliance claims, limits) as fact.
        Mentioning related documented facts is fine if they are not presented as the answer. Suggesting support is good.
        Fail if the response answers the question as if the information were documented.
      metric: Refusal

tests:
  - description: Office locations outside HQ
    vars:
      query: Does Brindlework have an office in Tokyo?
      context: |-
        [product_overview#chunk_0] source: product_overview.md | title: Brindlework Product Overview | type: official | updated: 2026-02-01
        # Brindlework Product Overview

        Brindlework is a project management and team collaboration platform for teams of every size. It was founded in 2019 and is headquartered in Lisbon, Portugal. Brindlework is available on the web, as desktop apps for Windows and macOS, and as mobile apps for iOS and Android.
      reference_answer: The documentation does not say. It only mentions headquarters in Lisbon, Portugal. The assistant should
        say it doesn't know and suggest contacting support at support@brindlework.example.
    metadata:
      id: un-001

  - description: CEO name
    vars:
      query: Who is the CEO of Brindlework?
      context: |-
        [product_overview#chunk_0] source: product_overview.md | title: Brindlework Product Overview | type: official | updated: 2026-02-01
        # Brindlework Product Overview

        Brindlework is a project management and team collaboration platform for teams of every size. It was founded in 2019 and is headquartered in Lisbon, Portugal. Brindlework is available on the web, as desktop apps for Windows and macOS, and as mobile apps for iOS and Android.

        ---

        [team_management#chunk_0] source: team_management.md | title: Team and Workspace Management | type: official | updated: 2026-03-02
        ## Roles

        Each workspace member has one role:

        - **Owner:** full control, including billing, deleting the workspace, and transferring ownership. A workspace can have up to 3 Owners.
        - **Admin:** manages members, integrations, and workspace settings, but cannot delete the workspace or change the plan.
        - **Member:** creates and works on projects and tasks they have access to.
        - **Guest:** external collaborator with access only to projects they are invited to.

        Billing admins are Admins who have also been given billing permission; they can view invoices and update payment methods.
      reference_answer: The documentation does not name the CEO. The assistant should say it doesn't know.
    metadata:
      id: un-003

  - description: Notion integration
    vars:
      query: Can I sync my Brindlework tasks with Notion?
      context: |-
        [integrations_and_api#chunk_0] source: integrations_and_api.md | title: Integrations and API | type: official | updated: 2026-06-05
        ## Available integrations

        | Integration | Plans | What it does |
        |---|---|---|
        | Slack | All plans | Task notifications in channels, create tasks from messages |
        | Microsoft Teams | All plans | Task notifications and a personal Brindlework tab |
        | Google Drive / Dropbox | All plans | Attach cloud files to tasks |
        | GitHub / GitLab | Starter and above | Link commits and pull requests to tasks |
        | Webhooks | Starter and above | Send events to your own endpoints |
        | Zapier | Pro and above | Connect Brindlework to 5,000+ apps |
        | Salesforce | Enterprise only | Sync opportunities to projects |

        Integrations are connected by a workspace Admin or Owner in Settings > Integrations. The GitLab integration was added in version 4.8.
      reference_answer: Notion is not a documented integration. The assistant should say it doesn't know; it may mention that
        Zapier (Pro and above) connects to many apps but must not claim Notion is supported. Suggesting support at support@brindlework.example is expected.
    metadata:
      id: un-005

  - description: HIPAA compliance
    vars:
      query: Is Brindlework HIPAA compliant and will you sign a BAA?
      context: |-
        [data_retention_and_privacy#chunk_4] source: data_retention_and_privacy.md | title: Data Retention and Privacy | type: official | updated: 2026-05-20
        ## Compliance

        Brindlework complies with GDPR and offers a Data Processing Agreement (DPA), which can be signed online in Settings > Workspace > Legal. Brindlework is SOC 2 Type II certified. Brindlework does not sell customer data, and customer content is not used to train AI models.

        ---

        [account_security#chunk_5] source: account_security.md | title: Account Security | type: official | updated: 2026-04-22
        ## Encryption

        All data is encrypted at rest with AES-256 and in transit with TLS 1.2 or higher. Brindlework is SOC 2 Type II certified. Security reports are available to Enterprise customers under NDA.
      reference_answer: The documentation covers GDPR, a DPA, and SOC 2 Type II but says nothing about HIPAA or BAAs. The assistant
        should not claim HIPAA compliance and should suggest contacting support at support@brindlework.example or sales.
    metadata:
      id: un-007

  - file://../../datasets/suites/02_generation/refusal.yaml
