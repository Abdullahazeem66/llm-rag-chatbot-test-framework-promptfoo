  - description: Support response time on cheapest plan with Timeline view
    vars:
      query: How quickly will support respond on the cheapest plan that includes the Timeline view?
      context: |-
        [product_overview#chunk_1] source: product_overview.md | title: Brindlework Product Overview | type: official | updated: 2026-02-01
        ## Core concepts

        A **workspace** is the top-level container for an organization. Each workspace has its own members, billing, and settings. A workspace contains **projects**, and each project contains **tasks**. Tasks can have assignees, due dates, priorities (Low, Medium, High, Urgent), subtasks, comments, and file attachments.

        Projects can be viewed in several ways:

        - **List view** shows tasks as a sortable, filterable list. Available on all plans.
        - **Board view** shows tasks as cards in Kanban columns. Available on all plans.
        - **Calendar view** shows tasks by due date. Available on all plans.
        - **Timeline view** (Gantt chart) shows task durations and dependencies. Available on Pro and Enterprise plans only.

        ---

        [support_and_sla#chunk_0] source: support_and_sla.md | title: Support Channels and Response Times | type: official | updated: 2026-01-15
        # Support Channels and Response Times

        Business hours are Monday to Friday, 08:00 to 18:00 UTC, excluding Portuguese public holidays.

        | Plan | Support channels | First response target |
        |---|---|---|
        | Free | Help center and community forum | No guaranteed response |
        | Starter | Email | Within 48 business hours |
        | Pro | Email and live chat | Within 8 business hours |
        | Enterprise | Email, live chat, and 24/7 phone | 1 hour for P1 (critical) issues, 4 hours for P2 |
      reference_answer: Timeline view is available on Pro and Enterprise only, so the cheapest such plan is Pro. Pro support
        (email and live chat) targets a first response within 8 business hours.
    metadata:
