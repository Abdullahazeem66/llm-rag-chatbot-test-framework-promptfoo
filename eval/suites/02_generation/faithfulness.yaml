  - description: Old desktop version cannot sync
    vars:
      query: My desktop app is version 4.3 and it won't sync. Why?
      context: |-
        [troubleshooting#chunk_2] source: troubleshooting.md | title: Troubleshooting Guide | type: official | updated: 2026-07-01
        ## Desktop app is not syncing

        1. Check that you are online and that status.brindlework.example shows no incidents.
        2. Sign out and sign back in.
        3. Clear the local cache: open Help > Troubleshooting > Clear cache. This does not delete any data stored on Brindlework servers.
        4. Update to the latest version. Desktop app versions older than 4.5 are no longer supported and cannot sync.

        ---

        [release_notes#chunk_4] source: release_notes.md | title: Release Notes | type: official | updated: 2026-08-12
        ## Version 4.5 - April 9, 2025

        - New desktop sync engine. Desktop versions older than 4.5 can no longer sync.
      reference_answer: Desktop versions older than 4.5 are no longer supported and cannot sync, because version 4.5 (April
        9, 2025) introduced a new sync engine. Update to the latest version.
