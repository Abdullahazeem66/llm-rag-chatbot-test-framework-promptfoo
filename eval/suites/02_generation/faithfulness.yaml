# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Generation (isolated) › Faithfulness — answers make no claims beyond the retrieved context"

prompts:
  - id: bree-default-v1
    label: "prompt-v1"
    raw: |
      You are Bree, the customer support assistant for Brindlework, a project management platform.

      Answer the user's question using ONLY the context below.
      - If the context does not contain the answer, say you don't know and suggest contacting support@brindlework.example.
      - Cite the chunk IDs you used in square brackets, for example [pricing_plans#chunk_1].
      - If sources conflict, prefer official documents over community content, and newer documents over older or archived ones.
      - Be concise and specific.

      Context:
      <<RETRIEVED_CONTEXT>>

      Question: {{query}}
      Answer:

providers:
  - id: file://../../providers/generation_only.py
    label: generation-recommended
    config:
      pipeline: recommended
      workers: 4

defaultTest:
  options:
    provider:
      id: openai:gpt-6-luna
      config:
        omitDefaults: true
        passthrough: { reasoning: { effort: medium } }
  assert:
    - type: context-faithfulness
      contextTransform: context.metadata.retrieved_context
      threshold: 0.8
      metric: Faithfulness

tests:
  - description: Unspecified price question
    vars:
      query: How much does it cost?
      context: |-
        [pricing_plans#chunk_1] source: pricing_plans.md | title: Pricing and Plans (2026) | type: official | updated: 2026-01-15
        ## Plan comparison

        | Plan | Monthly price (per user) | Annual price (per user, per month) | Max members | Storage (per workspace) | Guests |
        |---|---|---|---|---|---|
        | Free | $0 | $0 | 5 | 2 GB | 0 |
        | Starter | $8 | $6.40 | 25 | 100 GB | 5 |
        | Pro | $15 | $12 | Unlimited | 1 TB | 50 |
        | Enterprise | Custom | Custom | Unlimited | Unlimited | Unlimited |

        Annual billing gives a 20% discount compared to monthly billing. Annual plans are billed upfront for the full year.
      reference_answer: 'The question does not say which plan. The assistant should ask which plan is meant or summarize plan
        prices: Free $0, Starter $8 ($6.40 annual), Pro $15 ($12 annual) per user per month, Enterprise custom.'
    metadata:
      id: amb-001

  - description: Owner vs Admin role
    vars:
      query: What is the difference between an Owner and an Admin?
      context: |-
        [team_management#chunk_0] source: team_management.md | title: Team and Workspace Management | type: official | updated: 2026-03-02
        ## Roles

        Each workspace member has one role:

        - **Owner:** full control, including billing, deleting the workspace, and transferring ownership. A workspace can have up to 3 Owners.
        - **Admin:** manages members, integrations, and workspace settings, but cannot delete the workspace or change the plan.
        - **Member:** creates and works on projects and tasks they have access to.
        - **Guest:** external collaborator with access only to projects they are invited to.

        Billing admins are Admins who have also been given billing permission; they can view invoices and update payment methods.
      reference_answer: Owners have full control, including billing, deleting the workspace, and transferring ownership. Admins
        manage members, integrations, and workspace settings but cannot delete the workspace or change the plan.
    metadata:
      id: cmp-001

  - description: Pro annual vs monthly savings
    vars:
      query: How much does one user save per year on Pro by paying annually instead of monthly?
      context: |-
        [pricing_plans#chunk_1] source: pricing_plans.md | title: Pricing and Plans (2026) | type: official | updated: 2026-01-15
        ## Plan comparison

        | Plan | Monthly price (per user) | Annual price (per user, per month) | Max members | Storage (per workspace) | Guests |
        |---|---|---|---|---|---|
        | Free | $0 | $0 | 5 | 2 GB | 0 |
        | Starter | $8 | $6.40 | 25 | 100 GB | 5 |
        | Pro | $15 | $12 | Unlimited | 1 TB | 50 |
        | Enterprise | Custom | Custom | Unlimited | Unlimited | Unlimited |

        Annual billing gives a 20% discount compared to monthly billing. Annual plans are billed upfront for the full year.
      reference_answer: Pro costs $15 per month on monthly billing ($180 per year) and $12 per month on annual billing ($144
        per year), so annual billing saves $36 per user per year, a 20% discount.
    metadata:
      id: cmp-003

  - description: Audit logs Pro vs Enterprise
    vars:
      query: Compare audit log retention between Pro and Enterprise.
      context: |-
        [account_security#chunk_4] source: account_security.md | title: Account Security | type: official | updated: 2026-04-22
        ## Audit logs

        Audit logs record sign-ins, permission changes, exports, and deletions.

        - Pro: audit logs are kept for 90 days
        - Enterprise: audit logs are kept for 1 year and can be streamed to a SIEM

        Audit logs are not available on the Free and Starter plans.
      reference_answer: Pro keeps audit logs for 90 days. Enterprise keeps them for 1 year and can stream them to a SIEM. Free
        and Starter do not have audit logs.
    metadata:
      id: cmp-005

  - description: SMS two-factor codes
    vars:
      query: Can I receive two-factor authentication codes by SMS?
      context: |-
        [community_faq_2023#chunk_0] source: community_faq_2023.md | title: Community FAQ (unofficial) | type: community | updated: 2023-06-18
        # Community FAQ (unofficial)

        This FAQ was written by members of the Brindlework community forum. It is not an official Brindlework document and may be out of date.

        **Can I get a refund on a monthly plan?**
        Yes, in my experience Brindlework refunds monthly plans within 30 days, no questions asked.

        **Does Brindlework support SMS two-factor authentication?**
        Yes, you can get 2FA codes by SMS or with an authenticator app.

        **How long does Trash keep deleted items?**
        I think deleted items stay in Trash for 60 days.

        **Is there a Gantt chart?**
        Yes, the Timeline view is basically a Gantt chart. You need a paid plan.

        **Can I use Brindlework offline?**
        The desktop app lets you view projects you opened recently while offline, and it syncs changes when you reconnect.

        ---

        [account_security#chunk_1] source: account_security.md | title: Account Security | type: official | updated: 2026-04-22
        ## Two-factor authentication (2FA)

        Two-factor authentication is available to every user on every plan. Brindlework supports authenticator apps (TOTP) and hardware security keys (WebAuthn / FIDO2). SMS codes are not supported.

        When you enable 2FA, you receive 10 single-use recovery codes. Store them safely: if you lose access to your authenticator and your recovery codes, a workspace Owner must reset your 2FA, or, if you are the only Owner, you must contact support and verify your identity.

        Admins on Pro and Enterprise plans can require 2FA for all members in Settings > Security > Authentication. Members without 2FA are asked to set it up at their next sign-in.

        ---

        [release_notes#chunk_1] source: release_notes.md | title: Release Notes | type: official | updated: 2026-08-12
        ## Version 5.1 - May 20, 2026

        - EU data residency (Frankfurt) is now available on the Pro plan. Previously it was available only on Enterprise.
        - Admins on Pro and Enterprise can require two-factor authentication for all members.
        - SMS-based two-factor authentication has been removed. Users who relied on SMS codes must switch to an authenticator app or a security key.
      reference_answer: No. SMS-based 2FA was removed in version 5.1 (May 20, 2026). Use an authenticator app (TOTP) or a hardware
        security key (WebAuthn/FIDO2).
    metadata:
      id: cf-002

