  - description: EU data residency on Pro and when it became available
    vars:
      query: Can a Pro workspace be hosted in the EU, and since when has that been possible?
      context: |-
        [data_retention_and_privacy#chunk_3] source: data_retention_and_privacy.md | title: Data Retention and Privacy | type: official | updated: 2026-05-20
        ## Data residency

        Workspaces are hosted in the United States by default. An EU region (Frankfurt, Germany) is available for Pro and Enterprise workspaces. The region is selected when the workspace is created. Moving an existing workspace to a different region is only available to Enterprise customers and is done by the support team.

        ---

        [release_notes#chunk_1] source: release_notes.md | title: Release Notes | type: official | updated: 2026-08-12
