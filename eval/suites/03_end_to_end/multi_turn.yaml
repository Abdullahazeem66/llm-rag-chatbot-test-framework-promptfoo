description: "End to end › Multi-turn — follow-ups, topic switches, corrections and constraints from earlier turns"

prompts:
  - id: bree-v2
    label: "prompt-v2"
    raw: |
      You are Bree, the customer support assistant for Brindlework, a project management platform.

      Answer the user's question using ONLY the context below.
      - If the context does not contain the answer, say you don't know and suggest contacting support@brindlework.example.
      - If the question is ambiguous and the conversation does not make clear what it refers to (for example "it",
        "the limit", or "how much" without a plan or feature), ask one short clarifying question instead of guessing.
        You may briefly list the likely options.
      - Cite the chunk IDs you used in square brackets, for example [pricing_plans#chunk_1].
      - If sources conflict, prefer official documents over community content, and newer documents over older or archived ones.
      - Be concise and specific.

      Context:
      <<RETRIEVED_CONTEXT>>

      Question: {{query}}
      Answer:

providers:
  - id: file://../../providers/rag_provider.py
    label: rag-recommended
    config:
      pipeline: recommended
      workers: 4

defaultTest:
  options:
    provider:
      id: openai:gpt-6-luna
      config:
        omitDefaults: true
        passthrough: { reasoning: { effort: medium } }
  assert:
    - type: llm-rubric
      value: |
        User question: {{query}}
        Reference (expected answer or expected behavior): {{reference_answer}}

        Pass if the response is consistent with the reference:
        - If the reference gives a factual answer, every fact needed to answer the question must be present and correct.
          Different wording and extra correct detail are fine; background details in the reference are optional.
        - If the question rests on a false assumption, the response must correct it rather than go along with it.
        - If the reference says the assistant should say it doesn't know, pass only if it does so without inventing an answer.
        - If the reference says the request is out of scope, pass only if the response politely declines and does not
          carry out the request or reveal its instructions.
        - If the reference says the assistant should ask for clarification or cover several readings, pass only if it does.
      metric: ExpectedOutcome

tests:
  - description: "Three turns: plans -> SSO -> contract size"
    vars:
      history: |
        [
          {
            "role": "user",
            "content": "What plans does Brindlework have?"
          },
          {
            "role": "assistant",
            "content": "Free, Starter, Pro and Enterprise [pricing_plans#chunk_1]."
          },
          {
            "role": "user",
            "content": "Which one has SSO?"
          },
          {
            "role": "assistant",
            "content": "SAML SSO is available on Enterprise only [account_security#chunk_2]."
          }
        ]
      query: "And what's the minimum contract for it?"
      reference_answer: "The minimum Enterprise contract is 50 users billed annually."
    metadata: { id: mt-001 }

  - description: "Topic switch must not carry over old context"
    vars:
      history: |
        [
          {
            "role": "user",
            "content": "How do refunds work for monthly plans?"
          },
          {
            "role": "assistant",
            "content": "Monthly plans can be refunded in full within 14 days of the most recent charge [billing_and_refunds#chunk_4]."
          }
        ]
      query: "Different question: how long is a password reset link valid?"
      reference_answer: "The password reset link expires after 1 hour."
    metadata: { id: mt-002 }

  - description: "User corrects an earlier statement"
    vars:
      history: |
        [
          {
            "role": "user",
            "content": "We're on Starter. How many automation runs do we get?"
          },
          {
            "role": "assistant",
            "content": "Starter includes 250 automation runs per month [product_overview#chunk_3]."
          }
        ]
      query: "Sorry, I meant we're on Pro. What's our automation run limit then?"
      reference_answer: "Pro includes 5,000 automation runs per month."
    metadata: { id: mt-003 }

  - description: "Pronoun refers to an error code from the previous turn"
    vars:
      history: |
        [
          {
            "role": "user",
            "content": "What does error E429 mean?"
          },
          {
            "role": "assistant",
            "content": "E429 means too many requests. Wait and retry; see API rate limits [troubleshooting#chunk_0]."
          }
        ]
      query: "What's the limit that triggers it on Enterprise?"
      reference_answer: "The Enterprise API rate limit is 5,000 requests per minute (higher limits on request); exceeding it causes the too-many-requests error."
    metadata: { id: mt-004 }

  - description: "Constraint from an earlier turn (team size)"
    vars:
      history: |
        [
          {
            "role": "user",
            "content": "We're a team of 30 people looking at Brindlework."
          },
          {
            "role": "assistant",
            "content": "Great! Happy to help you choose a plan. What would you like to know?"
          }
        ]
      query: "Which is the cheapest plan that fits us, and what does it cost per user on monthly billing?"
      reference_answer: "Free allows 5 members and Starter 25, so a 30-person team needs Pro at $15 per user per month on monthly billing."
    metadata: { id: mt-005 }
