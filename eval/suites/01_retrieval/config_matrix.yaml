# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Compares 5 retrieval setups (dense, keyword, hybrid, query rewrite, hybrid + rerank) on the same cases to pick the best one.
description: "Retrieval › Config matrix — compare pipeline variants side by side with chunking-agnostic metrics (FactRecall, DocRecall, FactMRR)"

prompts:
  - id: query-only
    label: "Raw query"
    raw: "{{query}}"

providers:
  - id: file://../../providers/retriever_only.py
    label: baseline
    config: { pipeline: baseline, pinned: true, workers: 4 }
  - id: file://../../providers/retriever_only.py
    label: bm25
    config: { pipeline: bm25, pinned: true, workers: 4 }
  - id: file://../../providers/retriever_only.py
    label: hybrid
    config: { pipeline: hybrid, pinned: true, workers: 4 }
  - id: file://../../providers/retriever_only.py
    label: rewrite
    config: { pipeline: rewrite, pinned: true, workers: 4 }
  - id: file://../../providers/retriever_only.py
    label: hr_rerank_low
    config: { pipeline: hr_rerank_low, pinned: true, workers: 4 }

defaultTest:
  assert:
    - type: python
      value: file://../../asserts/retrieval_metrics.py:fact_recall
      config: { pass_at: 1 }
      metric: FactRecall
    - type: python
      value: file://../../asserts/retrieval_metrics.py:doc_recall
      metric: DocRecall
    - type: python
      value: file://../../asserts/retrieval_metrics.py:fact_mrr
      metric: FactMRR

tests:
  - description: Unspecified price question
    vars:
      query: How much does it cost?
      reference_answer: 'The question does not say which plan. The assistant should ask which plan is meant or summarize plan
        prices: Free $0, Starter $8 ($6.40 annual), Pro $15 ($12 annual) per user per month, Enterprise custom.'
    metadata:
      id: amb-001
      gold_ids:
      - pricing_plans#chunk_1
      key_facts:
      - '| Starter | $8 | $6.40 |'
      - '| Pro | $15 | $12 |'

  - description: Legacy Business plan price
    vars:
      query: How much does the Business plan cost?
      reference_answer: The Business plan was renamed Pro in release 5.0 (January 15, 2026). Pro costs $15 per user per month
        on monthly billing or $12 per user per month billed annually. Under the archived 2024 pricing, Business was $12 monthly,
        and legacy customers keep that price until their next renewal after January 15, 2027.
    metadata:
      id: cf-003
      gold_ids:
      - release_notes#chunk_2
      - pricing_plans#chunk_1
      key_facts:
      - the Business plan was renamed Pro
      - '| Pro | $15 | $12 |'

  - description: 'Follow-up: extending Trash retention'
    vars:
      history: |
        [
          {"role": "user", "content": "How long do deleted items stay in the Trash?"},
          {"role": "assistant", "content": "Deleted items stay in the Trash for 30 days and are then permanently deleted [data_retention_and_privacy#chunk_0]."}
        ]
      query: Can that be extended?
      reference_answer: Yes, on Enterprise. Enterprise workspaces can configure Trash retention of up to 180 days.
    metadata:
      id: conv-002
      gold_ids:
      - data_retention_and_privacy#chunk_0
      key_facts:
      - up to 180 days

  - description: 'Follow-up: file limit on Free after error E204'
    vars:
      history: |
        [
          {"role": "user", "content": "What does error E204 mean?"},
          {"role": "assistant", "content": "E204 means the attachment is larger than your plan's file size limit. Compress the file or upgrade your plan [troubleshooting#chunk_0]."}
        ]
      query: What's the limit on the Free plan?
      reference_answer: On the Free plan the maximum size of a single attachment is 10 MB.
    metadata:
      id: conv-004
      gold_ids:
      - troubleshooting#chunk_1
      key_facts:
      - Free 10 MB

  - description: EU data residency on Pro and when it became available
    vars:
      query: Can a Pro workspace be hosted in the EU, and since when has that been possible?
      reference_answer: Yes. Pro workspaces can use the EU region in Frankfurt, Germany. It became available on Pro in version
        5.1 on May 20, 2026; before that it was Enterprise only. The region is chosen when the workspace is created.
    metadata:
      id: mh-002
      gold_ids:
      - data_retention_and_privacy#chunk_3
      - release_notes#chunk_1
      key_facts:
      - Frankfurt
      - May 20, 2026

  - description: Cheapest annual price with Brindlework AI
    vars:
      query: What is the cheapest annual per-user price for a plan that includes Brindlework AI?
      reference_answer: Brindlework AI is included in Pro and Enterprise. The cheapest is Pro at $12 per user per month on annual
        billing.
    metadata:
      id: mh-008
      gold_ids:
      - product_overview#chunk_4
      - pricing_plans#chunk_1
      key_facts:
      - Brindlework AI is included in Pro and Enterprise plans
      - '| Pro | $15 | $12 |'

  - description: API rate limit response
    vars:
      query: What happens when my API integration exceeds the rate limit?
      reference_answer: The API responds with HTTP status 429 and a Retry-After header that says how many seconds to wait before
        retrying.
    metadata:
      id: sh-010
      gold_ids:
      - integrations_and_api#chunk_2
      key_facts:
      - '429'
      - Retry-After

  - file://../../datasets/suites/01_retrieval/config_matrix.yaml
