- description: Service credit for 98.5% uptime
  vars:
    query: Our Enterprise uptime last month was 98.5%. What service credit do we get?
    context: |-
      [support_and_sla#chunk_2] source: support_and_sla.md | title: Support Channels and Response Times | type: official | updated: 2026-01-15
      ## Uptime commitment

      Brindlework targets 99.9% monthly uptime for all paid plans. Enterprise contracts include a 99.95% uptime SLA with service credits: 10% of the monthly fee if uptime falls below 99.95%, and 25% if it falls below 99.0%. Service status is published at status.brindlework.example.
    reference_answer: Uptime below 99.0% qualifies for a service credit of 25% of the monthly fee under the Enterprise 99.95%
      uptime SLA.
  metadata:
    id: num-005

