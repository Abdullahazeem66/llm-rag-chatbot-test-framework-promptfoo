- description: Minimum password length
  vars:
    query: What is the minimum password length?
    context: |-
      [account_security#chunk_0] source: account_security.md | title: Account Security | type: official | updated: 2026-04-22
      ## Passwords

      Passwords must be at least 12 characters long and cannot match any of your last 5 passwords. Brindlework checks new passwords against known breached password lists. You can reset your password from the sign-in page using "Forgot password"; the reset link expires after 1 hour.
    reference_answer: Passwords must be at least 12 characters long and cannot match any of your last 5 passwords.
  metadata:
    id: sh-003

- description: Trash retention period
  vars:
    query: How long are deleted items kept in the Trash?
    context: |-
      [data_retention_and_privacy#chunk_0] source: data_retention_and_privacy.md | title: Data Retention and Privacy | type: official | updated: 2026-05-20
      ## Trash

      Deleted tasks, projects, and files are moved to the Trash. Items in the Trash are kept for 30 days and can be restored by the person who deleted them or by a workspace Admin. After 30 days they are permanently deleted. Enterprise workspaces can configure Trash retention of up to 180 days.
    reference_answer: Deleted items are kept in the Trash for 30 days and then permanently deleted. Enterprise workspaces
      can configure Trash retention of up to 180 days.
  metadata:
    id: sh-005

- description: Invitation expiry
  vars:
    query: How long does a workspace invitation stay valid?
    context: |-
      [team_management#chunk_1] source: team_management.md | title: Team and Workspace Management | type: official | updated: 2026-03-02
      ## Inviting people

      Owners and Admins can invite people by email in Settings > Members > Invite. Invitations expire after 7 days. On the Starter plan and above, admins can also allow anyone with an email address from an approved domain to join the workspace automatically.
    reference_answer: Invitations expire after 7 days.
  metadata:
    id: sh-007

