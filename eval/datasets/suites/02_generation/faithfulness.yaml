- description: Getting data back
  vars:
    query: How do I get my data back?
    context: |-
      [data_retention_and_privacy#chunk_0] source: data_retention_and_privacy.md | title: Data Retention and Privacy | type: official | updated: 2026-05-20
      ## Trash

      Deleted tasks, projects, and files are moved to the Trash. Items in the Trash are kept for 30 days and can be restored by the person who deleted them or by a workspace Admin. After 30 days they are permanently deleted. Enterprise workspaces can configure Trash retention of up to 180 days.

      ---

      [data_retention_and_privacy#chunk_1] source: data_retention_and_privacy.md | title: Data Retention and Privacy | type: official | updated: 2026-05-20
      ## Exporting data

      Workspace Owners and Admins can export all workspace data at any time in Settings > Workspace > Export. Exports are available in CSV and JSON formats and include tasks, comments, and project structure. File attachments are exported as a separate ZIP archive. Export links expire after 7 days.
    reference_answer: This could mean restoring deleted items or exporting data. Deleted items can be restored from the Trash
      within 30 days (by the person who deleted them or an Admin). Owners and Admins can export all workspace data as CSV
      or JSON in Settings > Workspace > Export. The assistant should cover both or ask which is meant.
  metadata:
    id: amb-003

