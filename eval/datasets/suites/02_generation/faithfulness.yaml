- description: Webhook signing
  vars:
    query: How can I verify that a webhook request really came from Brindlework?
    context: |-
      [integrations_and_api#chunk_3] source: integrations_and_api.md | title: Integrations and API | type: official | updated: 2026-06-05
      ## Webhooks

      Webhooks send an HTTP POST request to your endpoint for events such as task.created, task.updated, and task.completed. Each request is signed with an HMAC-SHA256 signature in the `X-Brindlework-Signature` header. If your endpoint does not return a 2xx status, Brindlework retries up to 5 times with exponential backoff over about 1 hour.
    reference_answer: Each webhook request is signed with an HMAC-SHA256 signature sent in the X-Brindlework-Signature header.
  metadata:
    id: sh-011

