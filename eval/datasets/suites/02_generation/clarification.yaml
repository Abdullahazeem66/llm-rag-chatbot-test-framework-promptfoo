    context: |-
      [pricing_plans#chunk_2] source: pricing_plans.md | title: Pricing and Plans (2026) | type: official | updated: 2026-01-15
      ## Free trial

      New workspaces can start a 14-day free trial of the Pro plan. No credit card is required to start the trial. At the end of the trial, the workspace automatically moves to the Free plan unless a paid plan is selected. If the workspace has more than 5 members when it moves to the Free plan, it becomes read-only until members are removed or a paid plan is chosen.

      ---

      [integrations_and_api#chunk_0] source: integrations_and_api.md | title: Integrations and API | type: official | updated: 2026-06-05
      ## Available integrations

      | Integration | Plans | What it does |
      |---|---|---|
      | Slack | All plans | Task notifications in channels, create tasks from messages |
      | Microsoft Teams | All plans | Task notifications and a personal Brindlework tab |
      | Google Drive / Dropbox | All plans | Attach cloud files to tasks |
      | GitHub / GitLab | Starter and above | Link commits and pull requests to tasks |
      | Webhooks | Starter and above | Send events to your own endpoints |
      | Zapier | Pro and above | Connect Brindlework to 5,000+ apps |
      | Salesforce | Enterprise only | Sync opportunities to projects |

      Integrations are connected by a workspace Admin or Owner in Settings > Integrations. The GitLab integration was added in version 4.8.
    reference_answer: The question does not say which feature. The assistant should ask what feature the user means.
