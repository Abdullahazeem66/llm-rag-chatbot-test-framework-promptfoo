    context: |-
      [integrations_and_api#chunk_2] source: integrations_and_api.md | title: Integrations and API | type: official | updated: 2026-06-05
      ## Rate limits

      API rate limits are applied per workspace:

      - Free: 60 requests per minute
      - Starter: 300 requests per minute
      - Pro: 1,000 requests per minute
      - Enterprise: 5,000 requests per minute (higher limits available on request)

      When a limit is exceeded, the API responds with HTTP status 429 and a `Retry-After` header that tells you how many seconds to wait before retrying.

      ---

      [troubleshooting#chunk_1] source: troubleshooting.md | title: Troubleshooting Guide | type: official | updated: 2026-07-01
      ## File size limits

      The maximum size of a single attachment depends on the plan: Free 10 MB, Starter 100 MB, Pro 250 MB, and Enterprise 2 GB.
