- description: '[multilingual] Trash retention period'
  vars:
    query: Wie lange bleiben gelöschte Elemente im Papierkorb?
    reference_answer: Deleted items are kept in the Trash for 30 days and then permanently deleted. Enterprise workspaces
      can configure Trash retention of up to 180 days.
  metadata:
    id: sh-005~multilingual

- description: '[multilingual] Starter plan: Zapier access and API rate limit'
  vars:
    query: میں Starter plan استعمال کر رہا ہوں۔ کیا میں Zapier integration استعمال کر سکتا ہوں، اور میری API rate limit کیا
      ہے؟
    reference_answer: No. Zapier is only available on Pro and above, so Starter cannot use it. The Starter API rate limit
      is 300 requests per minute per workspace.
  metadata:
    id: mh-001~multilingual

- description: '[multilingual] Enterprise P1 response target'
  vars:
    query: Enterpriseプランの重大なP1問題に対する応答時間の目標は何ですか？
    reference_answer: Enterprise P1 (critical) issues have a first response target of 1 hour.
  metadata:
    id: num-004~multilingual
