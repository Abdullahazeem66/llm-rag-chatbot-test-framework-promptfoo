- description: Unspecified limit question
  vars:
    query: What's the limit?
    reference_answer: The question is too vague. The assistant should ask which limit is meant (for example API rate limits,
      storage, file size, members, or automation runs) and not guess a single number.
  metadata:
    id: amb-002

- description: Feature not specified
  vars:
    query: Is it available on Starter?
    reference_answer: The question does not say which feature. The assistant should ask what feature the user means.
  metadata:
    id: amb-004

- description: Starter vs Pro support response
  vars:
    query: How do support channels and response times differ between Starter and Pro?
    reference_answer: Starter has email support with a first response within 48 business hours. Pro has email and live chat
      with a first response within 8 business hours.
  metadata:
    id: cmp-002

- description: Monthly vs annual refund rules
  vars:
    query: How are refunds different for monthly and annual subscriptions?
    reference_answer: Monthly subscriptions can be refunded in full within 14 days of the most recent charge. Annual subscriptions
      can be refunded on a prorated basis within 30 days of the purchase or renewal date; after that they are not refundable,
      but auto-renewal can be turned off.
  metadata:
    id: cmp-004

- description: Monthly refund within 30 days (community FAQ says yes)
  vars:
    query: Can I get a refund on my monthly plan within 30 days?
    reference_answer: Only within 14 days. Monthly subscriptions can be refunded in full within 14 days of the most recent
      charge. The 30-day claim comes from an unofficial, outdated community FAQ.
  metadata:
    id: cf-001

- description: Legacy Business plan price
  vars:
    query: How much does the Business plan cost?
    reference_answer: The Business plan was renamed Pro in release 5.0 (January 15, 2026). Pro costs $15 per user per month
      on monthly billing or $12 per user per month billed annually. Under the archived 2024 pricing, Business was $12 monthly,
      and legacy customers keep that price until their next renewal after January 15, 2027.
  metadata:
    id: cf-003

- description: Trash retention (community FAQ says 60 days)
  vars:
    query: Is it true that deleted items stay in the Trash for 60 days?
    reference_answer: No. Deleted items stay in the Trash for 30 days (Enterprise can configure up to 180 days). The 60-day
      figure comes from an unofficial community FAQ.
  metadata:
    id: cf-005

- description: 'Follow-up: extending Trash retention'
  vars:
    history: |
      [
        {"role": "user", "content": "How long do deleted items stay in the Trash?"},
        {"role": "assistant", "content": "Deleted items stay in the Trash for 30 days and are then permanently deleted [data_retention_and_privacy#chunk_0]."}
      ]
    query: Can that be extended?
    reference_answer: Yes, on Enterprise. Enterprise workspaces can configure Trash retention of up to 180 days.
  metadata:
    id: conv-002

- description: 'Follow-up: file limit on Free after error E204'
  vars:
    history: |
      [
        {"role": "user", "content": "What does error E204 mean?"},
        {"role": "assistant", "content": "E204 means the attachment is larger than your plan's file size limit. Compress the file or upgrade your plan [troubleshooting#chunk_0]."}
      ]
    query: What's the limit on the Free plan?
    reference_answer: On the Free plan the maximum size of a single attachment is 10 MB.
  metadata:
    id: conv-004

- description: Enabling SMS 2FA
  vars:
    query: How do I turn on SMS codes for two-factor authentication?
    reference_answer: SMS codes are not supported (SMS 2FA was removed in version 5.1). Use an authenticator app (TOTP) or
      a hardware security key instead.
  metadata:
    id: fp-002

- description: Phone support on Starter
  vars:
    query: What's the phone number for Starter plan phone support?
    reference_answer: Starter does not include phone support; 24/7 phone support is Enterprise only. Starter support is by
      email with a first response within 48 business hours.
  metadata:
    id: fp-004

- description: 'Starter plan: Zapier access and API rate limit'
  vars:
    query: I'm on the Starter plan. Can I use the Zapier integration, and what is my API rate limit?
    reference_answer: No. Zapier is only available on Pro and above, so Starter cannot use it. The Starter API rate limit
      is 300 requests per minute per workspace.
  metadata:
    id: mh-001

- description: File size limit for the $8 plan
  vars:
    query: What is the largest single file I can attach on the plan that costs $8 per user per month?
    reference_answer: The $8 per user monthly plan is Starter, which allows attachments up to 100 MB each.
  metadata:
    id: mh-003

- description: 'Guests on Starter: seats and allowance'
  vars:
    query: On the Starter plan, do guests count as paid seats, and how many guests can I invite?
    reference_answer: Guests do not count as paid seats. The Starter plan allows up to 5 guests.
  metadata:
    id: mh-005

- description: Automation runs for the 1 TB plan
  vars:
    query: How many automation runs per month does the plan with 1 TB of storage include?
    reference_answer: The plan with 1 TB of storage is Pro, which includes 5,000 automation runs per month.
  metadata:
    id: mh-007

- description: Starter monthly cost for 10 users
  vars:
    query: How much would 10 users on the Starter plan cost per month with monthly billing?
    reference_answer: Starter is $8 per user per month on monthly billing, so 10 users cost $80 per month, excluding taxes.
  metadata:
    id: num-001

- description: Starter member limit
  vars:
    query: What is the maximum number of members on the Starter plan?
    reference_answer: The Starter plan allows up to 25 members.
  metadata:
    id: num-003

- description: Service credit for 98.5% uptime
  vars:
    query: Our Enterprise uptime last month was 98.5%. What service credit do we get?
    reference_answer: Uptime below 99.0% qualifies for a service credit of 25% of the monthly fee under the Enterprise 99.95%
      uptime SLA.
  metadata:
    id: num-005

