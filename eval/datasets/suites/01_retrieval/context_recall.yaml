    gold_ids:
    - account_security#chunk_0
    key_facts:
    - at least 12 characters

- description: Trash retention period
  vars:
    query: How long are deleted items kept in the Trash?
    reference_answer: Deleted items are kept in the Trash for 30 days and then permanently deleted. Enterprise workspaces
      can configure Trash retention of up to 180 days.
  metadata:
    id: sh-005
    gold_ids:
    - data_retention_and_privacy#chunk_0
    key_facts:
    - kept for 30 days
    - up to 180 days

