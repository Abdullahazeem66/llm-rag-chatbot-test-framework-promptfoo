- description: '[long_context] Starter plan: Zapier access and API rate limit'
  vars:
    query: 'Hi there! I''ve been using Brindlework with my team for a few months now and mostly love it, though the mobile app
      could be faster. My manager asked me to sort out a few admin things before our quarterly review next week. Anyway, here''s
      my actual question: I''m on the Starter plan. Can I use the Zapier integration, and what is my API rate limit? Thanks!
      Also, keep up the good work on the product.'
    reference_answer: No. Zapier is only available on Pro and above, so Starter cannot use it. The Starter API rate limit
      is 300 requests per minute per workspace.
  metadata:
    id: mh-001~long_context
    category: multi_hop
    difficulty: medium
    expected_behavior: answer
    gold_ids:
    - integrations_and_api#chunk_0
    - integrations_and_api#chunk_2
    key_facts:
    - '| Zapier | Pro and above |'
    - 'Starter: 300 requests per minute'
    source: human
    perturbation: long_context
    parent_id: mh-001

