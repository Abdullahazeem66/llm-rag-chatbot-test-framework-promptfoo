- description: "Starter plan: Zapier access and API rate limit"
  vars:
    query: "I'm on the Starter plan. Can I use the Zapier integration, and what is my API rate limit?"
    reference_answer: "No. Zapier is only available on Pro and above, so Starter cannot use it. The Starter API rate limit is 300 requests per minute per workspace."
  metadata:
    id: mh-001
    category: multi_hop
    difficulty: medium
    expected_behavior: answer
    gold_ids: [integrations_and_api#chunk_0, integrations_and_api#chunk_2]
    key_facts: ["| Zapier | Pro and above |", "Starter: 300 requests per minute"]
    source: human
    subsets: [phase5]

- description: "EU data residency on Pro and when it became available"
  vars:
    query: "Can a Pro workspace be hosted in the EU, and since when has that been possible?"
    reference_answer: "Yes. Pro workspaces can use the EU region in Frankfurt, Germany. It became available on Pro in version 5.1 on May 20, 2026; before that it was Enterprise only. The region is chosen when the workspace is created."
  metadata:
    id: mh-002
    category: multi_hop
    difficulty: medium
    expected_behavior: answer
    gold_ids: [data_retention_and_privacy#chunk_3, release_notes#chunk_1]
    key_facts: ["Frankfurt", "May 20, 2026"]
    source: human
    subsets: [phase5]

- description: "File size limit for the $8 plan"
  vars:
