- description: "Enterprise SSO options and audit log retention"
  vars:
    query: "What single sign-on options do we get on Enterprise, and how long are audit logs kept on that plan?"
    reference_answer: "Enterprise includes SAML 2.0 SSO with identity providers such as Okta, Microsoft Entra ID (Azure AD), Google Workspace, and OneLogin, plus SCIM 2.0 provisioning. Enterprise audit logs are kept for 1 year and can be streamed to a SIEM."
  metadata:
    id: mh-006
    category: multi_hop
    difficulty: medium
    expected_behavior: answer
    gold_ids: [account_security#chunk_2, account_security#chunk_4]
    key_facts: ["SAML 2.0", "Enterprise: audit logs are kept for 1 year"]
    source: human

