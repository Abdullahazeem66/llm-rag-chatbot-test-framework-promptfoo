- description: "Support response time on cheapest plan with Timeline view"
  vars:
    query: "How quickly will support respond on the cheapest plan that includes the Timeline view?"
    reference_answer: "Timeline view is available on Pro and Enterprise only, so the cheapest such plan is Pro. Pro support (email and live chat) targets a first response within 8 business hours."
