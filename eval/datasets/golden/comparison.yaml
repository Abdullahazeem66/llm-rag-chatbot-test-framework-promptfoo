- description: "Monthly vs annual refund rules"
  vars:
    query: "How are refunds different for monthly and annual subscriptions?"
    reference_answer: "Monthly subscriptions can be refunded in full within 14 days of the most recent charge. Annual subscriptions can be refunded on a prorated basis within 30 days of the purchase or renewal date; after that they are not refundable, but auto-renewal can be turned off."
  metadata:
    id: cmp-004
    category: comparison
    difficulty: medium
    expected_behavior: answer
    gold_ids: [billing_and_refunds#chunk_4]
    key_facts: ["within 14 days of the most recent charge", "within 30 days of the purchase or renewal date"]
    source: human

- description: "Audit logs Pro vs Enterprise"
  vars:
    query: "Compare audit log retention between Pro and Enterprise."
    reference_answer: "Pro keeps audit logs for 90 days. Enterprise keeps them for 1 year and can stream them to a SIEM. Free and Starter do not have audit logs."
  metadata:
