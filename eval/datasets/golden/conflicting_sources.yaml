    source: human
    subsets: [phase5]

- description: "SMS two-factor codes"
  vars:
    query: "Can I receive two-factor authentication codes by SMS?"
    reference_answer: "No. SMS-based 2FA was removed in version 5.1 (May 20, 2026). Use an authenticator app (TOTP) or a hardware security key (WebAuthn/FIDO2)."
  metadata:
    id: cf-002
    category: conflicting_sources
    difficulty: medium
    expected_behavior: answer
    gold_ids: [account_security#chunk_1, release_notes#chunk_1]
    key_facts: ["SMS codes are not supported", "SMS-based two-factor authentication has been removed"]
