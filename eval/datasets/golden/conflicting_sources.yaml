- description: "Monthly refund within 30 days (community FAQ says yes)"
  vars:
    query: "Can I get a refund on my monthly plan within 30 days?"
    reference_answer: "Only within 14 days. Monthly subscriptions can be refunded in full within 14 days of the most recent charge. The 30-day claim comes from an unofficial, outdated community FAQ."
  metadata:
    id: cf-001
    category: conflicting_sources
    difficulty: hard
    expected_behavior: answer
