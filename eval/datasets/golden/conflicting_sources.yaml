- description: "Trash retention (community FAQ says 60 days)"
  vars:
    query: "Is it true that deleted items stay in the Trash for 60 days?"
    reference_answer: "No. Deleted items stay in the Trash for 30 days (Enterprise can configure up to 180 days). The 60-day figure comes from an unofficial community FAQ."
