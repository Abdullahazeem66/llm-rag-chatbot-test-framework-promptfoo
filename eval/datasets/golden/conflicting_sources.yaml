    source: human

- description: "Legacy Business plan price"
  vars:
    query: "How much does the Business plan cost?"
    reference_answer: "The Business plan was renamed Pro in release 5.0 (January 15, 2026). Pro costs $15 per user per month on monthly billing or $12 per user per month billed annually. Under the archived 2024 pricing, Business was $12 monthly, and legacy customers keep that price until their next renewal after January 15, 2027."
  metadata:
    id: cf-003
    category: conflicting_sources
    difficulty: hard
    expected_behavior: answer
    gold_ids: [release_notes#chunk_2, pricing_plans#chunk_1]
    key_facts: ["the Business plan was renamed Pro", "| Pro | $15 | $12 |"]
    distractor_ids: [pricing_plans_2024_archived#chunk_1]
    source: human
    subsets: [phase5]

- description: "Free plan member limit (archived says 3)"
